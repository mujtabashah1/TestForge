name: Pull request validation
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
  api-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: testforge, POSTGRES_PASSWORD: testforge, POSTGRES_DB: testforge_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testforge -d testforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://testforge:testforge@localhost:5432/testforge_test?schema=public
      TEST_DATABASE_URL: postgresql://testforge:testforge@localhost:5432/testforge_test?schema=public
      JWT_SECRET: ci-only-test-secret-with-sufficient-length
      API_URL: http://localhost:4000/api
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run build -w @testforge/backend
      - name: Start backend
        run: npm run start -w @testforge/backend > backend.log 2>&1 &
      - run: npx wait-on http://localhost:4000/health
      - run: npm run test:api
      - run: npm run test:integration
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-reports
          path: |
            automation/playwright-report
            automation/allure-results
            automation/test-results
            backend.log
          if-no-files-found: ignore
  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: testforge, POSTGRES_PASSWORD: testforge, POSTGRES_DB: testforge_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testforge -d testforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://testforge:testforge@localhost:5432/testforge_test?schema=public
      TEST_DATABASE_URL: postgresql://testforge:testforge@localhost:5432/testforge_test?schema=public
      JWT_SECRET: ci-only-test-secret-with-sufficient-length
      API_URL: http://localhost:4000/api
      BASE_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Start backend
        run: npm run start -w @testforge/backend > backend.log 2>&1 &
      - name: Start frontend
        run: npm run start -w @testforge/frontend > frontend.log 2>&1 &
      - run: npx wait-on http://localhost:4000/health http://localhost:3000
      - run: npm run test -w @testforge/automation -- --project=chromium --project=e2e-chromium
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-reports
          path: |
            automation/playwright-report
            automation/allure-results
            automation/test-results
            backend.log
            frontend.log
          if-no-files-found: ignore
