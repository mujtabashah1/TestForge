services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testforge
      POSTGRES_PASSWORD: testforge
      POSTGRES_DB: testforge_dev
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testforge -d testforge_dev']
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://testforge:testforge@postgres:5432/testforge_dev?schema=public
      JWT_SECRET: local-compose-secret-change-outside-development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports: ['3000:3000']
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres-data:
